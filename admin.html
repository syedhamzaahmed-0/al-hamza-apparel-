
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al Hamza Apparel | Admin Login</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 background:#123c2d;font-family:Arial,sans-serif;padding:20px
}
.login{
 width:100%;max-width:400px;background:#fff;padding:35px;
 border-radius:16px;text-align:center
}
h1{color:#123c2d;margin-bottom:8px}
p{color:#777}
input{
 width:100%;padding:14px;margin:10px 0;
 border:1px solid #ddd;border-radius:8px;font-size:16px
}
button{
 width:100%;padding:14px;background:#123c2d;
 color:white;border:0;border-radius:8px;font-size:16px;
 cursor:pointer;margin-top:12px
}
#message{font-size:14px;overflow-wrap:anywhere}
a{color:#123c2d}
</style>
</head>
<body>
<div class="login">
<h1>AL HAMZA</h1>
<p>APPAREL · ADMIN PANEL</p>
<h2>Admin Login</h2>

<form id="loginForm">
<input id="email" type="email" placeholder="Admin Email" required>
<input id="password" type="password" placeholder="Password" required>
<button id="loginBtn" type="submit">Login to Dashboard</button>
</form>

<p id="message"></p>
<a href="./index.html">Back to Website</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://myrakbvclnknzuwnyqqm.supabase.co";
const SUPABASE_KEY = "sb_publishable_enl-tpMWqYVW4rVWo8F_Ug_ifJeaNOJ";

const db = window.supabase.createClient(
  SUPABASE_URL, SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const btn = document.getElementById("loginBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  btn.disabled = true;
  message.textContent = "Checking login...";

  try {
    const {data, error} = await db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    if(error) throw error;

    const {data: admin, error: adminError} = await db
      .from("admin_users")
      .select("user_id")
      .eq("user_id", data.user.id)
      .maybeSingle();

    if(adminError) throw adminError;

    if(!admin){
      await db.auth.signOut();
      throw new Error("You are not an authorized administrator.");
    }

    window.location.href = "./admin-dashboard.html";

  } catch(error) {
    message.textContent = error.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
